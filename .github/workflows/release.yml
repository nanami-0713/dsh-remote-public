name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Flutter checks
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/app-release.apk
          name: DSH-Remote ${{ github.ref_name }}

  npm:
    name: Publish dsh-remote plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Guard against publishing private paths
        run: |
          if grep -R -n -E '/home/your-username|100\.[0-9]+\.[0-9]+\.[0-9]+|your-github-username' README.md package.json bridge client.js index.js cordis.patch.yml 2>/dev/null; then
            echo '::error::private paths or tailnet IPs found; publish from the sanitized dsh-remote-public repository only'
            exit 1
          fi
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
