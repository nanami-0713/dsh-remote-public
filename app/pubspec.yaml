name: dsh_remote
description: Flutter app to remotely control local DeepSeek Harness (DSH) through a bridge.
publish_to: 'none'
version: 0.6.1+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^2.4.0
  cupertino_icons: ^1.0.6
  flutter_secure_storage: ^9.2.4
  flutter_zxing: ^2.3.0
  image_picker: ^1.2.3
  flutter_markdown_plus: ^1.0.12
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dsh_logo.png
